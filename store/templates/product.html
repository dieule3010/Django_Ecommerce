{% extends 'store/base.html' %}
{% block content %}
<div class="container my-5">
    <div class="card shadow-sm p-3">
        <div class="row g-0">
            <!-- Image -->
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                <img src="{{ product.image.url }}" class="img-fluid rounded" style="max-height:250px; object-fit:contain;" alt="{{ product.name }}">
            </div>

            <!-- Details -->
            <div class="col-md-8 p-4">
                <h3 class="fw-bold">{{ product.name }}</h3>
                <p class="text-muted">{{ product.description }}</p>

                {% if product.is_sale %}
                    <div class="mb-3">
                        <span class="text-muted"><s>${{ product.price }}</s></span>
                        <span class="fw-bold text-danger ms-2">${{ product.sale_price }}</span>
                        <span class="badge bg-warning text-dark ms-2">Sale!</span>
                    </div>
                {% else %}
                    <div class="fw-bold fs-5 mb-3">${{ product.price }}</div>
                    <div class="text-muted mb-3">ID: {{ product.id }}</div>
                {% endif %}

                <!-- Quantity -->
                <div class="mb-3 d-flex align-items-center gap-2">
                    <label for="qty-cart" class="mb-0 fw-medium">Quantity:</label>
                    <select id="qty-cart" class="form-select form-select-sm w-auto">
                        {% for i in 1|add:0|to:5 %}
                            <option value="{{ i }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <a href="{% url 'home' %}" class="btn btn-secondary">Home</a>
                    <button type="button" value="{{ product.id }}" class="btn btn-primary" id="add-cart">
                        <i class="fa-solid fa-cart-plus me-1"></i> Add To Cart
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).on('click', '#add-cart', function(e){
    e.preventDefault();

    $.ajax({
        type: 'POST',
        url: "{% url 'cart_add' %}",
        data: {
            product_id: $(this).val(),
            product_qty: $('#qty-cart').val(),
            csrfmiddlewaretoken: '{{ csrf_token }}',
            action: 'post'
        },
        success: function(json){
            document.getElementById("cart_quantity").textContent = json.qty;
            alert("Added to cart!");
        },
        error: function(xhr, errmsg, err){
            alert("Something went wrong!");
        }
    });
});
</script>
{% endblock %}
